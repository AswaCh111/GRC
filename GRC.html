/* ---------- seed & load ---------- */
async function seed(){

 const RK=[['Phishing Attack','Human',5,4,'Treating','Sara Khan','Awareness training, email filtering, MFA.'],['Ransomware','Cyber',4,5,'Assessed','Alex Morgan','Offline backups, EDR rollout, network segmentation.'],['Data Breach','Cyber',3,5,'Treating','Alex Morgan','Encrypt data at rest, DLP controls.'],['Unauthorized Access','Cyber',4,4,'Assessed','Sara Khan','Least privilege, quarterly access reviews.'],['Weak Passwords','Human',5,3,'Treating','Sara Khan','Enforce 12+ char policy and a password manager.'],['Insider Threat','Human',2,4,'Monitoring','Alex Morgan','User behaviour monitoring, separation of duties.'],['Unpatched Servers','Operational',4,4,'Identified','IT Ops','Monthly patch cycle with SLA tracking.'],['Third-Party Vendor Risk','Compliance',3,3,'Assessed','Procurement','Vendor security questionnaires.'],['Lost Laptop','Physical',2,3,'Resolved','IT Ops','Full-disk encryption and remote wipe.'],['DDoS Attack','Cyber',3,3,'Monitoring','Network Team','CDN and rate limiting.'],['Shadow IT','Operational',2,2,'Resolved','IT Ops','Approved SaaS catalogue.'],['Backup Failure','Operational',2,5,'Identified','IT Ops','Quarterly restore tests.']];
 const risks=RK.map((r,i)=>({id:'RSK-'+String(i+1).padStart(3,'0'),title:r[0],category:r[1],desc:r[0]+' could disrupt CyberTech Solutions operations or expose sensitive data.',l:r[2],i:r[3],owner:r[5],mit:r[6],status:r[4],created:dd(-90+i*6),updated:dd(-i)}));
 const PL=[['Password Security Policy','Approved','Rules for password length, rotation and MFA.'],['Access Control Policy','Approved','Role-based access and least privilege.'],['Data Protection Policy','Pending Approval','Classification, handling and retention of data.'],['Acceptable Use Policy','Approved','Acceptable use of company systems and networks.'],['Employee Security Responsibilities','Draft','Security duties for every employee.'],['Incident Response Policy','Approved','Roles and steps for responding to incidents.'],['Backup & Recovery Policy','Pending Approval','Backup frequency and restore testing.'],['Remote Work Policy','Draft','Secure remote working requirements.']];
 const policies=PL.map((p,i)=>({id:'POL-'+String(i+1).padStart(3,'0'),name:p[0],desc:p[2],owner:i%2?'Sara Khan':'Alex Morgan',status:p[1],created:dd(-120+i*8),updated:dd(-i*3)}));
 const FW=[['ISO','ISO/IEC 27001','International standard for information security management systems.',8,['A.5 Information security policies','A.6 Organization of information security','A.7 Human resource security','A.8 Asset management','A.9 Access control','A.10 Cryptography','A.12 Operations security','A.13 Communications security','A.16 Incident management','A.18 Compliance']],['GDPR','GDPR','EU regulation on personal data protection and privacy.',6,['Art.5 Processing principles','Art.6 Lawful basis','Art.7 Consent management','Art.15 Data subject access','Art.17 Right to erasure','Art.25 Privacy by design','Art.30 Records of processing','Art.32 Security of processing','Art.33 Breach notification','Art.37 DPO appointment']],['PCI','PCI DSS','Payment card industry data security standard.',3,['Req 1 Network firewalls','Req 2 Secure configurations','Req 3 Protect stored card data','Req 4 Encrypt transmission','Req 5 Anti-malware','Req 6 Secure systems and software','Req 7 Restrict access by need','Req 8 Identify and authenticate users','Req 9 Physical access','Req 10 Log and monitor access']]];
 const fw=FW.map((f,i)=>({id:f[0],name:f[1],desc:f[2],date:dd(-14-i*9),deadline:dd(25+i*20)}));
 const reqs=[];FW.forEach(f=>f[4].forEach((t,i)=>reqs.push({id:f[0]+'-'+String(i+1).padStart(2,'0'),fw:f[0],title:t,done:i<f[3],ev:i<f[3]?'evidence_'+(i+1)+'.pdf':''})));
 const AU=[['Annual ISO 27001 Internal Audit','Internal','Sara Khan',-60,-45,'Completed','Two access reviews were overdue.','Complete reviews quarterly.'],['Network Security Assessment','Technical','External Auditor',-20,-5,'In Progress','Firewall rules need cleanup.','Remove unused rules.'],['GDPR Data Mapping Review','Compliance','Alex Morgan',5,25,'Scheduled','',''],['PCI DSS Readiness Audit','Compliance','External Auditor',15,40,'Scheduled','',''],['Vendor Security Audit','Third-party','Sara Khan',-100,-80,'Completed','One vendor lacks an encryption policy.','Add encryption clause to contracts.']];
 const audits=AU.map((a,i)=>({id:'AUD-'+String(i+1).padStart(3,'0'),title:a[0],type:a[1],auditor:a[2],start:dd(a[3]),due:dd(a[4]),checklist:'Scope confirmed\nEvidence collected\nInterviews held\nReport drafted',findings:a[6],recs:a[7],status:a[5],created:dd(a[3]-5),updated:dd(a[3])}));
 const IN=[['Phishing Email','Phishing','Medium',-10,'Resolved'],['Malware Infection','Malware','High',-35,'Contained'],['Unauthorized Login','Access','Medium',-65,'Investigating'],['Data Leakage','Data','Critical',-95,'Investigating'],['Ransomware Attack','Malware','Critical',-4,'Reported'],['Suspicious Network Scan','Network','Low',-125,'Resolved']];
 const incidents=IN.map((n,i)=>({id:'INC-'+String(i+1).padStart(3,'0'),title:n[0],cls:n[1],sv:n[2],desc:n[0]+' detected at CyberTech Solutions.',date:dd(n[3]),officer:i%2?'Alex Morgan':'Sara Khan',actions:n[4]=='Reported'?'':'Isolated affected systems.',res:n[4]=='Resolved'?'Root cause removed, users notified.':'',status:n[4],tl:[{t:dd(n[3]),x:'Incident reported'}].concat(n[4]=='Reported'?[]:[{t:dd(n[3]+1),x:'Status → '+n[4]}]),created:dd(n[3]),updated:dd(n[3])}));
 db={users,risks,policies,fw,reqs,audits,incidents,logs:[{t:new Date().toISOString(),u:'System',a:'Demo data loaded for CyberTech Solutions'}],read:{}};save()}
async function boot(){try{db=JSON.parse(localStorage.getItem(K))}catch(x){}if(!db||!db.users)await seed();
 const t=localStorage.getItem('grc_theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t;
 const sid=localStorage.getItem('grc_sess');me=db.users.find(u=>u.id==sid&&u.st=='Active')||null;render()}
/* ---------- backend layer (all permission checks live here) ---------- */
const MODS=[['policies','Policies'],['risks','Risks'],['audits','Audits'],['incidents','Incidents'],['reqs','Compliance checklist']];
const rights=(u,ent)=>{if(u.role=='Admin')return{c:1,e:1,d:1};const o=u.rights&&u.rights[ent];if(o)return o;return u.role=='Security Officer'?{c:1,e:1,d:1}:{c:0,e:0,d:0}};

const log=a=>{db.logs.unshift({t:new Date().toISOString(),u:me?me.name:'Anonymous',a});db.logs=db.logs.slice(0,200)};
function api(ent,act,rec){
 if(!me||me.st!='Active')throw Error('Not authenticated');
 if(ent=='users'){if(me.role!='Admin')throw Error('Forbidden: Admin only')}else{const k2={add:'c',edit:'e',del:'d'}[act];if(!rights(me,ent=='fw'?'reqs':ent)[k2])throw Error('Forbidden: you do not have '+act+' rights for '+ent)}
 if(ent=='policies'&&rec.status=='Approved'&&me.role!='Admin')throw Error('Only an Admin can approve policies');
 const L=db[ent];let o=null;
 if(act=='add'){if(ent=='fw'){rec.id=rec.name.replace(/[^A-Za-z0-9]/g,'').slice(0,8).toUpperCase()||'FW';if(L.some(x=>x.id==rec.id))throw Error('A framework with that name already exists');rec.date=today()}else{const n=Math.max(0,...L.filter(x=>ent!='reqs'||x.fw==rec.fw).map(x=>+x.id.split('-')[1]))+1;rec.id=(ent=='reqs'?rec.fw:PRE[ent])+'-'+String(n).padStart(ent=='reqs'?2:3,'0')}rec.created=rec.updated=today();if(ent=='incidents')rec.tl=[{t:today(),x:'Incident reported'}];if(ent=='users')rec.prefs={};L.unshift(rec)}
 else{const i=L.findIndex(x=>x.id==rec.id);if(i<0)throw Error('Record not found');o=L[i];
  if(act=='del'){if(ent=='users'&&o.id==me.id)throw Error('You cannot delete your own account');L.splice(i,1)}
  else{if(ent=='users'&&o.id==me.id&&rec.st=='Inactive')throw Error('You cannot deactivate yourself');if(ent=='incidents'&&rec.status&&rec.status!=o.status)rec.tl=[...o.tl,{t:today(),x:'Status → '+rec.status}];L[i]={...o,...rec,updated:today()};if(ent=='reqs'){const f=db.fw.find(x=>x.id==o.fw);f.date=today()}}}
 log(`${act=='add'?'Created':act=='del'?'Deleted':'Updated'} ${ent.replace(/s$/,'')} ${rec.id}`);save();return rec}
/* ---------- charts ---------- */
function donut(d,cols){const T=d.reduce((a,x)=>a+x[1],0),R=52,C=2*Math.PI*R;let off=0;cols=cols||PAL;
 const arcs=d.filter(x=>x[1]).map(x=>{const L=x[1]/T*C,i=d.indexOf(x),c=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${cols[i%cols.length]}" stroke-width="22" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${e(x[0])}: ${x[1]}</title></circle>`;off+=L;return c}).join('');
 return `<div class="dn"><svg viewBox="0 0 140 140" width="140" role="img"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--bd)" stroke-width="22"/>${arcs}<text x="70" y="76" text-anchor="middle" fill="var(--tx)" font-size="22" font-weight="700">${T}</text></svg><div>${d.map((x,i)=>`<div class="lg"><i style="background:${cols[i%cols.length]}"></i>${e(x[0])} <b>${x[1]}</b></div>`).join('')}</div></div>`}
function bars(d,cols,mx){cols=cols||PAL;const M=mx||Math.max(1,...d.map(x=>x[1])),s=300/d.length;
 return `<svg viewBox="0 0 300 150" width="100%" role="img">${d.map((x,i)=>{const h=x[1]/M*95;return `<rect x="${i*s+s*.18}" y="${112-h}" width="${s*.64}" height="${h}" rx="4" fill="${cols[i%cols.length]}"><title>${e(x[0])}: ${x[1]}</title></rect><text x="${i*s+s/2}" y="${106-h}" text-anchor="middle" font-size="10" fill="var(--tx)">${x[1]}</text><text x="${i*s+s/2}" y="130" text-anchor="middle" font-size="9" fill="var(--mu)">${e(x[0])}</text>`}).join('')}</svg>`}
function line(d){const M=Math.max(1,...d.map(x=>x[1])),s=300/(d.length-1||1),P=d.map((x,i)=>[i*s*.9+15,112-x[1]/M*90]);
 return `<svg viewBox="0 0 300 150" width="100%" role="img"><polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--cy)" stroke-width="3"/>${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--pu)"><title>${d[i][0]}: ${d[i][1]}</title></circle><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="10" fill="var(--tx)">${d[i][1]}</text><text x="${p[0]}" y="132" text-anchor="middle" font-size="9" fill="var(--mu)">${d[i][0]}</text>`).join('')}</svg>`}
/* ---------- helpers ---------- */
const pct=id=>{const r=db.reqs.filter(x=>x.fw==id);return r.length?Math.round(r.filter(x=>x.done).length/r.length*100):0},cst=p=>p>=80?'Compliant':p>=40?'Partially Compliant':'Non-Compliant';
function alerts(){const a=[],p=me.prefs||{};
 db.risks.filter(r=>sev(r)=='Critical'&&r.status!='Resolved').forEach(r=>a.push({k:'r'+r.id,ty:'risk',ic:'alert-triangle',m:`Critical risk: ${r.title} (score ${sc(r)})`}));
 db.audits.filter(x=>x.status!='Completed').forEach(x=>{a.push({k:'a'+x.id,ty:'audit',ic:'clipboard-list',m:`Pending audit: ${x.title}, due ${x.due}`});if(x.due<today())a.push({k:'o'+x.id,ty:'overdue',ic:'clock',m:`Overdue task: ${x.title} was due ${x.due}`})});
 db.fw.forEach(f=>{const q=pct(f.id);if(q<80)a.push({k:'c'+f.id,ty:'comp',ic:'shield-check',m:`${f.name} is at ${q}%, deadline ${f.deadline}`})});
 db.incidents.filter(i=>i.status!='Resolved').forEach(i=>a.push({k:'i'+i.id,ty:'inc',ic:'zap',m:`Active incident: ${i.title} (${i.sv}, ${i.status})`}));
 db.policies.filter(x=>x.status=='Pending Approval').forEach(x=>a.push({k:'p'+x.id,ty:'pol',ic:'file-text',m:`Policy awaiting approval: ${x.name}`}));

const arights=()=>`<div class="card" style="margin-top:14px"><h3>Audit Rights</h3><p class="mu">Choose who can create, edit and delete audits. Admins always can.</p>${db.users.filter(u=>u.role!='Admin').map(u=>{const r=rights(u,'audits'),on=r.c&&r.e&&r.d;return `<div class="cl"><div><b>${e(u.name)}</b> ${badge(u.role)}</div><button class="b s ${on?'':'g'}" onclick="aud('${u.id}',${!on})">${on?'Rights granted (click to remove)':'Grant audit rights'}</button></div>`}).join('')}</div>`;
function rts(id){const u=db.users.find(x=>x.id==id);if(u.role=='Admin')return modal(`<h3>${e(u.name)}</h3><p class="mu">Admins always have full rights.</p><div class="ac"><button class="b" onclick="modal()">Close</button></div>`);
 modal(`<form onsubmit="rsub(event,'${id}');return false"><h3>Rights for ${e(u.name)}</h3><p class="mu">Role default: ${e(u.role)}. Tick what this user may do.</p><div class="tw"><table><thead><tr><th>Module</th><th>Create</th><th>Edit</th><th>Delete</th></tr></thead><tbody>${MODS.map(([k,l])=>{const r=rights(u,k);return `<tr><td>${l}</td>${['c','e','d'].map(a=>`<td><input type="checkbox" style="width:auto" aria-label="${l} ${a}" name="${k}.${a}" ${r[a]?'checked':''}></td>`).join('')}</tr>`}).join('')}</tbody></table></div><div class="ac" style="margin-top:12px"><button type="button" class="b g" onclick="rrs('${id}')">Reset to role default</button><button type="button" class="b g" onclick="modal()">Cancel</button><button class="b">Save rights</button></div></form>`)}
function rsub(ev,id){const f=new FormData(ev.target),R={};MODS.forEach(([k])=>{R[k]={};['c','e','d'].forEach(a=>R[k][a]=f.has(k+'.'+a)?1:0)});try{api('users','edit',{id,rights:R});modal();toast('Rights saved');render()}catch(x){toast(x.message,1)}}
function rrs(id){try{api('users','edit',{id,rights:null});modal();toast('Rights reset to role default');render()}catch(x){toast(x.message,1)}}
function aud(id,v){const u=db.users.find(x=>x.id==id),R={...(u.rights||{})};R.audits=v?{c:1,e:1,d:1}:{c:0,e:0,d:0};try{api('users','edit',{id,rights:R});toast(v?'Audit rights granted':'Audit rights removed');render()}catch(x){toast(x.message,1)}}
function acomp(id){const a=db.audits.find(x=>x.id==id);modal(`<form onsubmit="acsub(event,'${id}');return false"><h3>Complete: ${e(a.title)}</h3><label>Findings *<textarea name="f" rows="3">${e(a.findings)}</textarea></label><label>Recommendations *<textarea name="r" rows="3">${e(a.recs)}</textarea></label><div class="ac"><button type="button" class="b g" onclick="modal()">Cancel</button><button class="b">Mark completed</button></div></form>`)}
function acsub(ev,id){const f=new FormData(ev.target),F=f.get('f').trim(),R=f.get('r').trim();if(!F||!R)return toast('Findings and recommendations are required',1);try{api('audits','edit',{id,findings:F,recs:R,status:'Completed'});modal();toast('Audit completed');render()}catch(x){toast(x.message,1)}}
function openReq(){modal(`<form onsubmit="reqsub(event);return false"><h3>New requirement</h3><label>Framework *<select name="fw">${db.fw.map(f=>`<option value="${f.id}" ${f.id==cf?'selected':''}>${e(f.name)}</option>`).join('')}</select></label><label>Requirement *<input name="t"></label><div class="ac"><button type="button" class="b g" onclick="modal()">Cancel</button><button class="b">Add requirement</button></div></form>`)}
function reqsub(ev){const f=new FormData(ev.target),t=f.get('t').trim();if(t.length<3)return toast('Enter a requirement name (3+ characters)',1);try{api('reqs','add',{fw:f.get('fw'),title:t,done:false,ev:''});cf=f.get('fw');modal();toast('Requirement added');render()}catch(x){toast(x.message,1)}}
function openFw(){modal(`<form onsubmit="fwsub(event);return false"><h3>New framework</h3><label>Name *<input name="n"></label><label>Description *<textarea name="d" rows="3"></textarea></label><label>Deadline *<input name="dl" type="date" value="${dd(60)}"></label><div class="ac"><button type="button" class="b g" onclick="modal()">Cancel</button><button class="b">Add framework</button></div></form>`)}
function fwsub(ev){const f=new FormData(ev.target),n=f.get('n').trim(),d=f.get('d').trim();if(!n||!d||!f.get('dl'))return toast('Name, description and deadline are required',1);try{const r=api('fw','add',{name:n,desc:d,deadline:f.get('dl')});cf=r.id;modal();toast('Framework added. Add its requirements next.');render()}catch(x){toast(x.message,1)}}
const NAV=[['dashboard','Dashboard','layout-dashboard'],['policies','Governance','file-text'],['risks','Risks','alert-triangle'],['compliance','Compliance','check-square'],['audits','Audits','clipboard-check'],['incidents','Incidents','flame'],['reports','Reports','bar-chart-3'],['notifs','Notifications','bell'],['users','Users','users'],['settings','Settings','settings']];
const PG={dashboard:['Dashboard',dash],policies:[M.policies.t,()=>list('policies')],risks:[M.risks.t,()=>list('risks')],compliance:['Compliance Management',comp],audits:[M.audits.t,()=>list('audits')],incidents:[M.incidents.t,()=>list('incidents')],reports:['Reports Center',rep],notifs:['Notification Center',notifs],users:[M.users.t,users],settings:['Settings',sett]};
function go(v){view=v;sq='';cell=null;const m=Q('#main');if(m)m.innerHTML='<div class="ld"></div>';Q('.side')?.classList.remove('open');setTimeout(render,160)}
function render(){Q('#app').innerHTML=me?shell():authUI();icons();const i=Q('.sr input');if(i&&sq){i.focus();i.setSelectionRange(sq.length,sq.length)}}
function shell(){if(view=='users'&&me.role!='Admin')view='dashboard';const n=unread();
 return `<aside class="side"><div class="logo"><i data-lucide="shield"></i>GRC SHIELD</div>${NAV.filter(x=>x[0]!='users'||me.role=='Admin').map(x=>`<button class="nv ${x[0]==view?'on':''}" onclick="go('${x[0]}')"><i data-lucide="${x[2]}"></i>${x[1]}${x[0]=='notifs'&&n?`<span class="nb">${n}</span>`:''}</button>`).join('')}<div style="margin-top:auto;padding:10px" class="mu">${e(me.name)}<br>${badge(me.role)}</div><button class="nv" onclick="out()"><i data-lucide="log-out"></i>Log out</button></aside>
 <main class="main" id="main"><div class="top"><button class="b g mb" aria-label="Menu" onclick="Q('.side').classList.toggle('open')"><i data-lucide="menu"></i></button><h2>${PG[view][0]}</h2><span class="mu">CyberTech Solutions</span><button class="b g s" aria-label="Toggle theme" onclick="th(document.documentElement.dataset.theme=='dark'?'light':'dark')"><i data-lucide="sun"></i></button></div><div class="view">${PG[view][1]()}</div></main>`}
function authUI(){const f={login:`<form onsubmit="dl(event);return false"><label>Email<input name="email" type="email" autocomplete="username"></label><label>Password<input name="pw" type="password" autocomplete="current-password"></label><button class="b" style="width:100%">Sign in</button></form><div class="demo"><span class="mu">Demo accounts (click to fill)</span><button class="b g s" onclick="fill('admin@cybertech.io','Admin@123')">Admin: admin@cybertech.io / Admin@123</button><button class="b g s" onclick="fill('officer@cybertech.io','Officer@123')">Security Officer: officer@cybertech.io / Officer@123</button><button class="b g s" onclick="fill('viewer@cybertech.io','Viewer@123')">Viewer: viewer@cybertech.io / Viewer@123</button></div>`,
 reg:`<form onsubmit="dr(event);return false"><label>Full name<input name="name"></label><label>Email<input name="email" type="email"></label><label>Password (min 8)<input name="pw" type="password"></label><p class="mu">New accounts start as Viewer. An Admin can change the role.</p><button class="b" style="width:100%">Create account</button></form>`,
 forgot:`<form onsubmit="df(event);return false"><div class="note">Demo mode: there is no email server, so you set the new password directly.</div><label>Email<input name="email" type="email"></label><label>New password (min 8)<input name="pw" type="password"></label><button class="b" style="width:100%">Reset password</button></form>`}[at];
 return `<div class="auth"><div class="card"><div class="logo" style="padding:0"><i data-lucide="shield"></i>GRC SHIELD</div><p class="mu">Governance, Risk and Compliance Management for CyberTech Solutions</p><div class="tabs">${[['login','Sign in'],['reg','Register'],['forgot','Forgot password']].map(x=>`<button class="b s ${x[0]==at?'':'g'}" onclick="at='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${f}</div></div>`}
const fill=(a,b)=>{Q('[name=email]').value=a;Q('[name=pw]').value=b};
async function dl(ev){const f=new FormData(ev.target),em=f.get('email').trim().toLowerCase(),u=db.users.find(x=>x.email==em);if(!u||u.hash!=await hp(em,f.get('pw')))return toast('Wrong email or password',1);if(u.st!='Active')return toast('This account is deactivated. Contact an Admin.',1);me=u;localStorage.setItem('grc_sess',u.id);log('Signed in');save();view='dashboard';render();toast('Welcome, '+u.name)}
async function dr(ev){const f=new FormData(ev.target),n=f.get('name').trim(),em=f.get('email').trim().toLowerCase(),p=f.get('pw');if(!n||!/^\S+@\S+\.\S+$/.test(em))return toast('Enter your name and a valid email',1);if(p.length<8)return toast('Password must be at least 8 characters',1);if(db.users.some(u=>u.email==em))return toast('That email is already registered',1);
 const id='USR-'+String(Math.max(...db.users.map(u=>+u.id.split('-')[1]))+1).padStart(3,'0');db.users.push({id,name:n,email:em,hash:await hp(em,p),role:'Viewer',st:'Active',created:today(),prefs:{}});me=db.users.at(-1);log('Registered account');save();localStorage.setItem('grc_sess',id);render();toast('Account created')}
async function df(ev){const f=new FormData(ev.target),em=f.get('email').trim().toLowerCase(),p=f.get('pw'),u=db.users.find(x=>x.email==em);if(!u)return toast('No account with that email',1);if(p.length<8)return toast('Password must be at least 8 characters',1);u.hash=await hp(em,p);db.logs.unshift({t:new Date().toISOString(),u:u.name,a:'Reset password'});save();at='login';render();toast('Password reset. Sign in with the new password.')}
boot();
</script></body></html>
